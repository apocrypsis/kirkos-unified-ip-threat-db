name: Run IP Intel Unifier

on:
  # Triggers every day at 03:00 UTC.
  schedule:
    - cron: '0 3 * * *'

  # Also triggers when new code is pushed.
  push:
    branches: [ main ]

  # On-demand trigger.
  workflow_dispatch:

# Give the Action permission to push the built MMDB file back to the repo
permissions:
  contents: write  

jobs:
  run-ip-threat-unifier:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run builder script
      run: python build_db.py

    - name: Commit and push database update
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ip_intel.mmdb
        
        # Only commit if the binary tree data has actually changed
        if git diff-index --quiet HEAD; then
          echo "No database changes found. Skipping push."
        else
          git commit -m "Automated MMDB distribution update [skip ci]"
          git push origin main
        fi